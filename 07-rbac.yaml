apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-reader
  namespace: k8s-live-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: k8s-live-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-reader-pods
  namespace: k8s-live-demo
subjects:
  - kind: ServiceAccount
    name: demo-reader
    namespace: k8s-live-demo
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
