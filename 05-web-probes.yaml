apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-live-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web

  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine

          # Install redis-cli once when the Pod starts, then run NGINX.
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache redis
              exec nginx -g 'daemon off;'

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Pod is Ready only when Redis replies PONG.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  redis-cli -h redis-headless.k8s-live-demo.svc.cluster.local ping | grep -qx PONG
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          # NGINX process health only.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: page
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        - name: page
          configMap:
            name: demo-page
