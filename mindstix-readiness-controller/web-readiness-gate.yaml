# Apply this as a strategic-merge patch to your existing `web` Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-live-demo
spec:
  template:
    metadata:
      labels:
        demo.mindstix.io/check-mindstix: "true"
    spec:
      readinessGates:
        - conditionType: demo.mindstix.io/mindstix-reachable
