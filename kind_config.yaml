kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-live-demo

nodes:
  # Control plane also receives localhost traffic on ports 80/443.
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP

  # Two workers let you demonstrate Pod anti-affinity.
  - role: worker
  - role: worker
