apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-live-demo
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: demo-web
                topologyKey: kubernetes.io/hostname
